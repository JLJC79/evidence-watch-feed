name: Weekly Crossref pull

on:
  schedule:
    # 10:00 UTC Sunday = 20:00 Sunday in Brisbane (AEST, no daylight saving).
    # The issue run fires 00:00 Monday Brisbane, so the file is at most ~4 hours old.
    - cron: "0 10 * * 0"
  workflow_dispatch: {}   # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: crossref-pull
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull from Crossref
        env:
          # Change these two if the repository or Pages address changes.
          MAILTO: info@thresholdresearchgroup.com.au
          BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data
        run: |
          python fetch_crossref.py --out data --mailto "$MAILTO" --days 35 --base-url "$BASE_URL"

      - name: Commit the data folder
        run: |
          git config user.name "crossref-pull[bot]"
          git config user.email "crossref-pull@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Crossref pull $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
