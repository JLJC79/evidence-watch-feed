name: Weekly Crossref pull

on:
  schedule:
    # Three Sunday pulls, in UTC (Brisbane is UTC+10, no daylight saving):
    # 00:00 UTC = 10:00 Brisbane, 04:00 UTC = 14:00 Brisbane, 09:00 UTC = 19:00 Brisbane.
    # GitHub queues cron runs and has delayed this one by up to 7.5 hours (22 Nov 2026),
    # so the issue run at 00:00 Monday Brisbane needs at least one pull to land early.
    # The last run to finish wins; the data files are overwritten each time.
    - cron: "0 0 * * 0"
    - cron: "0 4 * * 0"
    - cron: "0 9 * * 0"
  workflow_dispatch: {}   # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: crossref-pull
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull from Crossref
        env:
          # Change these two if the repository or Pages address changes.
          MAILTO: info@thresholdresearchgroup.com.au
          BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data
        run: |
          python fetch_crossref.py --out data --mailto "$MAILTO" --days 35 --base-url "$BASE_URL"

      - name: Commit the data folder
        run: |
          git config user.name "crossref-pull[bot]"
          git config user.email "crossref-pull@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Crossref pull $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
